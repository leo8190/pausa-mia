app = "pausa-mia-api"
primary_region = "gru"

[build]
  dockerfile = "server/Dockerfile"

[env]
  NODE_ENV = "production"
  AI_SERVER_PORT = "3001"
  ACCOUNT_DB_PATH = "/data/app.db"
  ACCOUNT_ALLOWED_ORIGINS = "https://leo8190.github.io"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[mounts]]
  source = "pausa_mia_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
