name: Publicar Pausa Mía en GitHub Pages

# Publica únicamente el sitio estático de dist/. El servidor local de IA, las
# claves y el modo IA quedan fuera del artefacto: el sitio publicado usa sólo el
# motor local por reglas. VITE_ARGENTINE_TTS_ENDPOINT se incrusta en el frontend
# (no es un secreto); la UI sigue exigiendo consentimiento y sólo ofrece remoto
# tras fallo o incompatibilidad de Piper local.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compilar sitio estático
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build
        env:
          # Debe coincidir con el nombre del repositorio publicado.
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || '/pausa-mia/' }}
          # Endpoint público verificado (Fly). Sólo frontend; sin secretos.
          VITE_ARGENTINE_TTS_ENDPOINT: https://pausa-mia-voz-ar.fly.dev

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Desplegar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
